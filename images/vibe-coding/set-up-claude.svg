<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" font-family="Inter, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect width="1200" height="540" fill="#ffffff"/>
  <!-- navbar -->
  <rect width="1200" height="48" fill="#f4f5f7"/>
  <line x1="0" y1="48" x2="1200" y2="48" stroke="#e6e8eb"/>
  <text x="24" y="31" font-size="20" font-weight="800" fill="#0f172a">mogenius</text>
  <text x="150" y="29" font-size="13" fill="#5b6472">Team Apps</text>
  <rect x="242" y="12" width="64" height="25" rx="6" fill="#123a47"/>
  <text x="274" y="29" font-size="13" fill="#ffffff" text-anchor="middle">Setup</text>
  <path d="M1154 17 a9 9 0 1 0 6 16 a7 7 0 0 1 -6 -16 z" fill="#9aa2ad"/>
  <circle cx="1182" cy="21" r="5" fill="none" stroke="#9aa2ad" stroke-width="1.6"/>
  <path d="M1175 33 a7 7 0 0 1 14 0" fill="none" stroke="#9aa2ad" stroke-width="1.6"/>
  <!-- header -->
  <text x="180" y="92" font-size="22" font-weight="700" fill="#0f172a">Set up Claude</text>
  <text x="180" y="114" font-size="13" fill="#6b7280">A one-time setup that takes a few minutes. Afterwards you create and manage apps by</text>
  <text x="180" y="131" font-size="13" fill="#6b7280">chatting with Claude. Choose the Claude app you use:</text>
  <!-- connected banner -->
  <rect x="180" y="150" width="840" height="40" rx="8" fill="#eaf7ee" stroke="#d6ecdb"/>
  <text x="202" y="175" font-size="13" font-weight="700" fill="#1a7f37">Connected</text>
  <text x="286" y="175" font-size="13" fill="#2f5d3c">Last seen from Claude Code · 33 min ago. You're all set.</text>
  <!-- sub-tabs -->
  <text x="180" y="226" font-size="14" font-weight="600" fill="#0f172a">Claude web &amp; Desktop</text>
  <rect x="180" y="236" width="150" height="2" fill="#0f172a"/>
  <text x="352" y="226" font-size="14" fill="#6b7280">Claude Code</text>
  <line x1="180" y1="238" x2="1020" y2="238" stroke="#eceef1"/>
  <!-- step 1 -->
  <rect x="180" y="258" width="22" height="22" rx="5" fill="#123a47"/>
  <text x="191" y="274" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="214" y="275" font-size="15" font-weight="700" fill="#0f172a">Add mogenius vibe-coding to Claude</text>
  <text x="214" y="300" font-size="13" fill="#6b7280">Open Settings › Connectors in Claude and look for mogenius vibe-coding.</text>
  <!-- column A -->
  <text x="214" y="332" font-size="13" font-weight="700" fill="#0f172a">mogenius vibe-coding is in the list</text>
  <text x="214" y="352" font-size="12" fill="#9ca3af">Your Claude admin added it for the whole organization.</text>
  <text x="214" y="380" font-size="13" fill="#374151">1.  Click Connect next to mogenius vibe-coding.</text>
  <text x="214" y="404" font-size="13" fill="#374151">2.  Sign in with your company Microsoft account.</text>
  <!-- column B -->
  <text x="600" y="332" font-size="13" font-weight="700" fill="#0f172a">mogenius vibe-coding is not in the list</text>
  <text x="600" y="352" font-size="12" fill="#9ca3af">Add it to your own account.</text>
  <text x="600" y="380" font-size="13" fill="#374151">1.  Choose Add custom connector.</text>
  <text x="600" y="404" font-size="13" fill="#374151">2.  Name it mogenius vibe-coding and paste this server</text>
  <text x="617" y="420" font-size="13" fill="#374151">URL:</text>
  <rect x="600" y="432" width="250" height="42" rx="6" fill="#f6f7f9" stroke="#e5e7eb"/>
  <text x="614" y="451" font-size="11" fill="#374151" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">https://vibe-coding.</text>
  <text x="614" y="465" font-size="11" fill="#374151" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">example.com/mcp</text>
  <rect x="866" y="436" width="70" height="34" rx="6" fill="#eef0f2" stroke="#e5e7eb"/>
  <text x="901" y="457" font-size="12" font-weight="600" fill="#374151" text-anchor="middle" letter-spacing="0.5">COPY</text>
  <text x="600" y="498" font-size="13" fill="#374151">3.  Click Connect and sign in with your company Microsoft account.</text>
  <!-- step 2 -->
  <rect x="180" y="516" width="22" height="22" rx="5" fill="#123a47"/>
  <text x="191" y="532" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="214" y="533" font-size="15" font-weight="700" fill="#0f172a">Nothing else to add</text>
</svg>
